<nav
  class="bg-black text-white py-6 px-8 flex justify-between items-center font-montserrat"
>
  <div class="font-bold text-xl">
    <a href="#" class="hover:text-cyan-600">Kristian Pejić</a>
  </div>

  <div class="hidden md:flex space-x-8">
    <a href="#about" class="hover:text-cyan-600">{{ lang.t("about") }}</a>
    <a href="#my-work" class="hover:text-cyan-600">{{ lang.t("myWork") }}</a>
    <a href="#my-work" class="hover:text-cyan-600">{{ lang.t("projects") }}</a>
    <a href="#my-education" class="hover:text-cyan-600">{{
      lang.t("education")
    }}</a>
    <a href="#contact" class="hover:text-cyan-600">{{ lang.t("contactMe") }}</a>
  </div>

  <div class="hidden md:block">
    <button (click)="toggleLanguage()" class="hover:text-cyan-600">
      {{ lang.current === "en" ? "Hrvatski" : "English" }}
    </button>
  </div>

  <button
    (click)="toggleMenu()"
    [class.active]="isMenuOpen"
    class="block md:hidden hamburger-btn"
  >
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>

  <div
    [class.active]="isMenuOpen"
    class="mobile-menu block md:hidden fixed top-0 left-0 w-full bg-black transform -translate-y-full transition-transform duration-300 ease-in-out z-10"
  >
    <div class="flex flex-col items-center py-16 space-y-6">
      <a
        href="#about"
        (click)="closeMenu()"
        class="text-xl hover:text-cyan-600 transition-colors duration-300"
        >{{ lang.t("about") }}</a
      >
      <a
        href="#my-work"
        (click)="closeMenu()"
        class="text-xl hover:text-cyan-600 transition-colors duration-300"
        >{{ lang.t("myWork") }}</a
      >
      <a
        href="#my-work"
        (click)="closeMenu()"
        class="text-xl hover:text-cyan-600 transition-colors duration-300"
        >{{ lang.t("projects") }}</a
      >
      <a
        href="#my-education"
        (click)="closeMenu()"
        class="text-xl hover:text-cyan-600 transition-colors duration-300"
        >{{ lang.t("education") }}</a
      >
      <a
        href="#contact"
        (click)="closeMenu()"
        class="text-xl hover:text-cyan-600 transition-colors duration-300"
        >{{ lang.t("contactMe") }}</a
      >

      <button
        (click)="toggleLanguage()"
        class="text-xl hover:text-cyan-600 transition-colors duration-300"
      >
        {{ lang.current === "en" ? "Hrvatski" : "English" }}
      </button>
    </div>
  </div>
</nav>
